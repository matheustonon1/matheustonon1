name: Atualizar README

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gerar a atividade recente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/atividade.py
      - name: Salvar se algo mudou
        run: |
          if git diff --quiet README.md; then
            echo "Sem mudanças"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza a atividade recente"
          git push
